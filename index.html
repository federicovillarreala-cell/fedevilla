<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gridiron IQ">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Gridiron IQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="design.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2322d3a6'/><text x='16' y='22' font-size='16' text-anchor='middle' font-family='Arial' font-weight='900' fill='%230b1020'>IQ</text></svg>">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">IQ</div>
      <div>
        <div class="brand-name">Gridiron <span>IQ</span></div>
        <div class="brand-sub" id="brandSub">Fantasy football analyzer</div>
      </div>
    </div>
    <div class="top-actions" id="topActions"></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
  <nav class="bottombar" id="bottombar"></nav>
  <button class="slip-fab" id="slipFab" data-act="slip" hidden></button>
  <div class="modal" id="modal" hidden>
    <div class="modal-card" id="modalCard"></div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
